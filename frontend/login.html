<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login - Learning Box</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              greenbox: "#22C55E",
            },
          },
        },
      };
    </script>
  </head>

  <body class="min-h-screen bg-gray-50 flex items-center justify-center">
    <div class="w-full max-w-md px-6">
      <!-- Logo / Title -->
      <div class="text-center mb-8">
        <div
          class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-greenbox text-white text-2xl font-bold mb-4"
        >
          LB
        </div>

        <h1 class="text-3xl font-bold text-gray-900">Learning Box</h1>

        <p class="text-gray-500 mt-2">เข้าสู่ระบบเพื่อใช้งานระบบ</p>
      </div>

      <!-- Login Card -->
      <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8">
        <h2 class="text-xl font-semibold text-gray-900 mb-6">เข้าสู่ระบบ</h2>

        <form id="loginForm">
          <!-- Email -->
          <div class="mb-5">
            <label
              for="email"
              class="block text-sm font-medium text-gray-700 mb-2"
            >
              อีเมล
            </label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="example@email.com"
              required
              class="w-full px-4 py-3 border border-gray-300 rounded-xl outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500"
            />
          </div>

          <!-- Password -->
          <div class="mb-5">
            <label
              for="password"
              class="block text-sm font-medium text-gray-700 mb-2"
            >
              รหัสผ่าน
            </label>

            <input
              type="password"
              id="password"
              name="password"
              placeholder="กรอกรหัสผ่าน"
              required
              class="w-full px-4 py-3 border border-gray-300 rounded-xl outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500"
            />
          </div>

          <!-- Message -->
          <div
            id="message"
            class="hidden mb-5 px-4 py-3 rounded-xl text-sm"
          ></div>

          <!-- Login Button -->
          <button
            type="submit"
            id="loginButton"
            class="w-full bg-greenbox hover:bg-green-600 text-white font-semibold py-3 rounded-xl transition"
          >
            เข้าสู่ระบบ
          </button>
        </form>

        <!-- Register -->
        <div class="text-center mt-6 text-sm text-gray-500">
          ยังไม่มีบัญชี?

          <a
            href="register.html"
            class="text-green-600 font-semibold hover:text-green-700"
          >
            สมัครสมาชิก
          </a>
        </div>
      </div>

      <!-- Back -->
      <div class="text-center mt-6">
        <a
          href="register.html"
          class="text-sm text-gray-400 hover:text-gray-600"
        >
          ← กลับไปหน้าสมัครสมาชิก
        </a>
      </div>
    </div>

    <!-- Authentication -->
    <script src="auth.js"></script>

    <script>
      const loginForm = document.getElementById("loginForm");
      const loginButton = document.getElementById("loginButton");
      const message = document.getElementById("message");

      function showMessage(text, type) {
        message.textContent = text;

        message.classList.remove(
          "hidden",
          "bg-red-50",
          "text-red-600",
          "bg-green-50",
          "text-green-600",
        );

        if (type === "error") {
          message.classList.add("bg-red-50", "text-red-600");
        } else {
          message.classList.add("bg-green-50", "text-green-600");
        }
      }

      loginForm.addEventListener("submit", function (event) {
        event.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        // ป้องกันการกดซ้ำ
        loginButton.disabled = true;
        loginButton.textContent = "กำลังเข้าสู่ระบบ...";

        const result = loginUser(email, password);

        if (!result.success) {
          showMessage(result.message, "error");

          loginButton.disabled = false;
          loginButton.textContent = "เข้าสู่ระบบ";

          return;
        }

        // Login สำเร็จ
        showMessage("เข้าสู่ระบบสำเร็จ กำลังเข้าสู่ระบบ...", "success");

        setTimeout(function () {
          window.location.href = "index.html";
        }, 800);
      });
    </script>
  </body>
</html>
