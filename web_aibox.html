<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ทดสอบระบบ AI Learning Box</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-6 font-sans">
  <div class="max-w-2xl mx-auto space-y-6">

    <!-- Header & Server Status -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-2xl font-bold text-slate-800">AI Learning Box — Test Web</h1>
          <p class="text-sm text-slate-500 mt-1">หน้าต่างทดสอบ API หลังบ้านสำหรับคุณครู</p>
        </div>
        <button onclick="checkServerHealth()" class="px-3 py-1.5 text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg font-medium transition">
          🔄 เช็กสถานะเซิร์ฟเวอร์
        </button>
      </div>
      <div id="healthStatus" class="mt-3 text-sm font-medium text-slate-600 bg-slate-50 p-2.5 rounded-lg border border-slate-100">
        สถานะ: กำลังตรวจสอบ...
      </div>
    </div>

    <!-- Upload PDF Card -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
      <h2 class="text-lg font-semibold text-slate-800 mb-2">1. อัปโหลดชีตสอน (PDF)</h2>
      <p class="text-sm text-slate-500 mb-4">ส่งไฟล์ PDF ไปแปลงเป็น Vector บน Railway</p>

      <div class="space-y-4">
        <input type="file" id="pdfInput" accept="application/pdf"
          class="block w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer border border-slate-200 rounded-xl p-1" />

        <button onclick="uploadPDF()" id="uploadBtn"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-xl shadow transition disabled:opacity-50">
          📤 อัปโหลดและสร้าง Vector
        </button>
      </div>

      <!-- Upload Result Box -->
      <div id="uploadResult" class="hidden mt-4 p-4 rounded-xl text-sm"></div>
    </div>

    <!-- Question Logs Card -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h2 class="text-lg font-semibold text-slate-800">2. ประวัติคำถามจากนักเรียน</h2>
          <p class="text-sm text-slate-500">ข้อมูลคำถาม-คำตอบที่กล่องบันทึกกลับมา</p>
        </div>
        <button onclick="loadLogs()" class="px-3 py-1.5 text-xs bg-emerald-50 text-emerald-700 hover:bg-emerald-100 rounded-lg font-medium transition">
          ดึงข้อมูลล่าสุด
        </button>
      </div>

      <div id="logsContainer" class="space-y-3">
        <p class="text-sm text-slate-400 italic">กดปุ่ม "ดึงข้อมูลล่าสุด" เพื่อดูประวัติคำถาม</p>
      </div>
    </div>

  </div>

  <script>
    // URL ของ Railway ที่ Deploy ไว้
    const BASE_URL = "https://web-production-3eb56.up.railway.app";

    // 1. ตรวจสอบสถานะ Server ทันทีที่เปิดหน้าเว็บ
    async function checkServerHealth() {
      const box = document.getElementById("healthStatus");
      box.className = "mt-3 text-sm font-medium text-slate-600 bg-slate-50 p-2.5 rounded-lg border border-slate-100";
      box.innerText = "⏳ กำลังเชื่อมต่อไปยัง Railway...";

      try {
        const res = await fetch(`${BASE_URL}/`);
        const data = await res.json();
        box.className = "mt-3 text-sm font-medium text-emerald-700 bg-emerald-50 p-2.5 rounded-lg border border-emerald-100";
        box.innerText = `🟢 เซิร์ฟเวอร์ออนไลน์: ${data.message}`;
      } catch (err) {
        box.className = "mt-3 text-sm font-medium text-rose-700 bg-rose-50 p-2.5 rounded-lg border border-rose-100";
        box.innerText = `🔴 ไม่สามารถติดต่อเซิร์ฟเวอร์ได้ (${err.message})`;
      }
    }

    // 2. ฟังก์ชันอัปโหลดไฟล์ PDF
    async function uploadPDF() {
      const fileInput = document.getElementById("pdfInput");
      const btn = document.getElementById("uploadBtn");
      const resultBox = document.getElementById("uploadResult");

      if (!fileInput.files[0]) {
        alert("กรุณาเลือกไฟล์ PDF ก่อนครับ");
        return;
      }

      btn.disabled = true;
      btn.innerText = "⏳ กำลังอัปโหลดและคำนวณ Vector (อาจใช้เวลา 5-10 วินาที)...";
      resultBox.classList.remove("hidden");
      resultBox.className = "mt-4 p-4 rounded-xl text-sm bg-blue-50 text-blue-800 border border-blue-100";
      resultBox.innerText = "กำลังส่งไฟล์ไปยังเซิร์ฟเวอร์...";

      const formData = new FormData();
      formData.append("file", fileInput.files[0]);

      try {
        const res = await fetch(`${BASE_URL}/upload_pdf`, {
          method: "POST",
          body: formData
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();
        resultBox.className = "mt-4 p-4 rounded-xl text-sm bg-emerald-50 text-emerald-800 border border-emerald-100";
        resultBox.innerHTML = `
          <p class="font-bold">✅ อัปโหลดสำเร็จ!</p>
          <p class="mt-1">เวอร์ชันบทเรียน: <b>${data.version}</b> | หั่นได้ทั้งหมด: <b>${data.chunks} ท่อน</b></p>
          <p class="text-xs text-emerald-600 mt-1">พร้อมให้กล่อง Jetson ซิงค์ข้อมูลลงเครื่องแล้ว</p>
        `;
      } catch (err) {
        resultBox.className = "mt-4 p-4 rounded-xl text-sm bg-rose-50 text-rose-800 border border-rose-100";
        resultBox.innerText = `❌ เกิดข้อผิดพลาด: ${err.message}`;
      } finally {
        btn.disabled = false;
        btn.innerText = "📤 อัปโหลดและสร้าง Vector";
      }
    }

    // 3. ฟังก์ชันดึงประวัติคำถาม
    async function loadLogs() {
      const container = document.getElementById("logsContainer");
      container.innerHTML = `<p class="text-sm text-slate-500">กำลังโหลด...</p>`;

      try {
        const res = await fetch(`${BASE_URL}/view_logs`);
        const logs = await res.json();

        if (logs.length === 0) {
          container.innerHTML = `<p class="text-sm text-slate-400 italic">ยังไม่มีประวัติคำถามในระบบ</p>`;
          return;
        }

        container.innerHTML = logs.map((log, idx) => `
          <div class="p-3 bg-slate-50 rounded-xl border border-slate-100 text-sm">
            <p class="font-semibold text-slate-800">❓ คำถาม #${idx + 1}: ${log.question}</p>
            <p class="text-slate-600 mt-1">💡 คำตอบ: ${log.answer}</p>
          </div>
        `).join("");
      } catch (err) {
        container.innerHTML = `<p class="text-sm text-rose-600">โหลดประวัติไม่สำเร็จ: ${err.message}</p>`;
      }
    }

    // รันเช็กสถานะทันทีที่โหลดเสร็จ
    checkServerHealth();
  </script>
</body>
</html>
